[package]
name = "app"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Compiles the vendored rcheevos rc_hash sources (vendor/rcheevos) when they
# are present — see build.rs and src/retro_achievements/hash.rs.
cc = "1"

[dependencies]
serde_json = "1.0"
# OS randomness for the MyAnimeList PKCE verifier/state (src/mal/oauth.rs);
# already in the graph through rustls/ring, no new download.
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = "2.4.0"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
tokio = { version = "1", features = ["time", "rt", "sync"] }
sysinfo = "0.32"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# `metadea://` URL scheme (src/deep_link.rs). single-instance's `deep-link`
# feature forwards a second launch's argv to the deep-link plugin so the
# already-running window receives the URL instead of a new process.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
discord-rich-presence = "0.2"
unrar = "0.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Full backups (src/backup/archive.rs) are .7z with LZMA2. Pure Rust, so no
# 7-Zip install or C toolchain is needed; only the LZMA2 codec is enabled
# (no AES/bzip2/ppmd). The old .zip format is still read through `zip`.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress"] }
# SHA-256 for the backup manifest hashes and the Google OAuth PKCE S256
# challenge (src/google_drive/oauth.rs); already in the graph through tauri.
sha2 = "0.10"
# EPUB reader (src/epub_reader): container.xml / OPF / NCX / nav / chapter XHTML
# parsing. Already in the dependency graph through plist; escape-html resolves
# the HTML named entities (&nbsp; &mdash; ...) real EPUB chapters use.
quick-xml = { version = "0.39", features = ["escape-html"] }
# libmpv is loaded at runtime (see src/player/libmpv_ffi.rs) so that a
# missing DLL degrades to "engine unavailable" instead of a failed build.
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-dpapi = "0.1.0"
# Native child HWND that hosts the embedded mpv video surface (src/player/video_host.rs);
# DataExchange + Memory put exported clips on the clipboard as files (src/player/clip).
# Threading + Input_XboxController: the controller pause menu (src/game_pause).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"


